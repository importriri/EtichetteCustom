name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ETICHETTE_PRIVATE_DENYLIST: ${{ secrets.ETICHETTE_PRIVATE_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build and display tools
        run: sudo apt-get update && sudo apt-get install -y ant xvfb
      - name: Guard private identifiers
        if: env.ETICHETTE_PRIVATE_DENYLIST != ''
        run: python3 tools/private_identifier_guard.py
      - name: Verify source and standalone JAR
        run: ./verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EtichetteCustom-jar
          path: dist/EtichetteCustom.jar
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release Etichette Custom ')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EtichetteCustom-jar
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="${COMMIT_MESSAGE#Release Etichette Custom }"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          tag="v$version"
          gh release create "$tag" release/EtichetteCustom.jar \
            --target "$GITHUB_SHA" \
            --title "Etichette Custom $version" \
            --notes-file CHANGELOG.md
