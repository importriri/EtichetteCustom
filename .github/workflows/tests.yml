name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ETICHETTE_PRIVATE_DENYLIST: ${{ secrets.ETICHETTE_PRIVATE_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build and display tools
        run: sudo apt-get update && sudo apt-get install -y ant xvfb
      - name: Guard private identifiers
        if: env.ETICHETTE_PRIVATE_DENYLIST != ''
        run: python3 tools/private_identifier_guard.py
      - name: Verify source and standalone JAR
        run: ./verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EtichetteCustom-jar
          path: dist/EtichetteCustom.jar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: EtichetteCustom-linux-ui-audit
          path: build/ui-audit/*.png
          if-no-files-found: error
          retention-days: 14

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile application and tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build, prove-build | Out-Null
          $src = Get-ChildItem src -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          $prove = Get-ChildItem prove -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          javac --release 8 -encoding UTF-8 -Xlint:all,-serial,-this-escape,-options -Werror -d build $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          javac --release 8 -encoding UTF-8 -Xlint:all,-serial,-this-escape,-options -Werror -cp build -d prove-build $prove
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows core and graphical audits
        shell: pwsh
        run: |
          $cp = "build;prove-build"
          java '-Djava.awt.headless=true' -cp $cp prove.Tutte
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java '-Djava.awt.headless=true' -cp $cp prove.ProvaRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scale in 12,15,18,24) {
            java '-Djava.awt.headless=true' -cp $cp prove.ProvaEditorGrafico $scale
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            java '-Djava.awt.headless=true' -cp $cp prove.ProvaFlussoGrafico $scale
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EtichetteCustom-windows-ui-audit
          path: build/ui-audit/*.png
          if-no-files-found: error
          retention-days: 14

  sync-release-media:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ux-polish-2.0.2'
    needs: [test, windows-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-polish-2.0.2
      - uses: actions/download-artifact@v4
        with:
          name: EtichetteCustom-windows-ui-audit
          path: audit
      - name: Build repository media from verified Windows evidence
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          cp audit/windows-server-2025-flow-gallery-15.png docs/screenshot-vetrina.png
          cp audit/windows-server-2025-flow-workspace-15.png docs/screenshot-editor.png
          cp audit/windows-server-2025-flow-operator-15.png docs/screenshot-operatore.png
          convert audit/windows-server-2025-flow-gallery-15.png \
            -resize '960x600^' -gravity center -extent 960x600 /tmp/gallery.png
          convert audit/windows-server-2025-flow-workspace-15.png \
            -resize '960x600^' -gravity center -extent 960x600 /tmp/editor.png
          convert audit/windows-server-2025-flow-operator-15.png \
            -resize '960x600^' -gravity center -extent 960x600 /tmp/operator.png
          convert -delay 120 /tmp/gallery.png \
            -delay 160 /tmp/editor.png \
            -delay 160 /tmp/operator.png \
            -delay 120 /tmp/editor.png \
            -loop 0 -layers Optimize docs/demo.gif
          java -Djava.awt.headless=true -cp build:prove-build prove.ProvaMedia 2>/dev/null || true
      - name: Commit verified repository media
        run: |
          set -euo pipefail
          git config user.name "Sid Ahmed Riri"
          git config user.email "import.riri@gmail.com"
          git add docs/demo.gif docs/screenshot-vetrina.png docs/screenshot-editor.png docs/screenshot-operatore.png
          git diff --cached --quiet && exit 0
          git commit -m "Sync verified release media [skip ci]"
          git push origin HEAD:ux-polish-2.0.2

  release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release Etichette Custom ')
    needs: [test, windows-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EtichetteCustom-jar
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="${COMMIT_MESSAGE#Release Etichette Custom }"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          tag="v$version"
          awk -v version="$version" '
            $0 ~ "^## " version " " { section=1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          test -s release/RELEASE_NOTES.md
          gh release create "$tag" release/EtichetteCustom.jar \
            --target "$GITHUB_SHA" \
            --title "Etichette Custom $version" \
            --notes-file release/RELEASE_NOTES.md
      - name: Keep only the main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$encoded"
          done
